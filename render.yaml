# Render.com blueprint (free tier) — creates the backend web service.
# Deploy: push this repo to GitHub, then in Render dashboard: New > Blueprint > select repo.
services:
  - type: web
    name: market-intel-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: LLM_PROVIDER
        sync: false          # set in dashboard: openai_compatible
      - key: LLM_MODEL
        sync: false          # e.g. llama-3.3-70b-versatile
      - key: LLM_API_KEY
        sync: false          # paste Groq key in dashboard (never in repo)
      - key: LLM_BASE_URL
        sync: false          # https://api.groq.com/openai/v1
      - key: EMBEDDING_PROVIDER
        value: local
      - key: CORS_ORIGINS
        sync: false          # e.g. ["https://your-frontend.vercel.app"]
      - key: LOG_LEVEL
        value: INFO
